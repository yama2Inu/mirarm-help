    <article class="answer">
      <h2>Mirarm Proでは何ができますか？</h2>
      <p>広告がすべて消えます。アラームを4個以上作れます（無料では3個までです）。ロケーションも追加で登録できます。買い切りと月額の2つから選べます。</p>
    </article>
    <article class="answer">
      <h2>購入の解約・返金は？</h2>
      <p>解約と返金は、どちらもAppleが窓口です。月額プランの解約は、iPhoneの「設定」でいちばん上のお名前をタップし、「サブスクリプション」から行えます。</p>
      <p>返金は、Appleの<a href="https://reportaproblem.apple.com/">問題を報告するページ</a>から申し込めます。</p>
    </article>
